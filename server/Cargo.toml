[package]
name = "bulwark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "bulwark"

[[bin]]
name = "bulwark"
path = "src/main.rs"

[dependencies]
bulwark-filter.workspace = true
bulwark-upstream.workspace = true
bulwark-config.workspace = true
bulwark-engine.workspace = true
hickory-proto.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
utoipa.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
time.workspace = true
argon2.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
humantime.workspace = true
turso.workspace = true
mime_guess = "2"
# Global allocator. The per-query hot path is allocation-bound — finalize()/
# query-log dominates handle() and frees the log entry cross-thread on the
# writer — so a sharded allocator roughly halves per-request CPU vs the system
# default. jemalloc won a four-way bake-off (vs mimalloc/snmalloc/system),
# especially on the alloc-diverse blocked path, with the best steady-state RSS.
tikv-jemallocator = "0.6"
# Enable jemalloc's background purge thread at runtime (see main.rs): without it,
# the dirty pages freed when the filter is built/reloaded are not returned to the
# OS while the process is idle, roughly doubling steady-state RSS.
tikv-jemalloc-ctl = "0.6"

[dev-dependencies]
# Enables the additive trust-root hook only for examples/tests/benches — NOT the
# shipped binary (dev-dependencies are absent from a normal `cargo build`).
bulwark-upstream = { workspace = true, features = ["test-trust-roots"] }
# Self-signed cert generation for the mock upstreams in `bench_transports`.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# TLS / QUIC server sides of the mock upstreams.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
quinn.workspace = true
# DoH (h1/h2) mock server.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http = "1"
# DoH (HTTP/3) mock server.
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes.workspace = true
