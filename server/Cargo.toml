[package]
name = "bulwark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "bulwark"

[[bin]]
name = "bulwark"
path = "src/main.rs"

[dependencies]
bulwark-filter.workspace = true
bulwark-upstream.workspace = true
bulwark-config.workspace = true
bulwark-engine.workspace = true
hickory-proto.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
utoipa.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
time.workspace = true
argon2.workspace = true
base64.workspace = true
rand.workspace = true
humantime.workspace = true
turso.workspace = true
mime_guess = "2"
# Optional fast global allocator (see the `mimalloc` feature). The hot path
# allocates several times per query (parse, response build, encode, log entry)
# and frees the log entry cross-thread on the writer — an alloc pattern that a
# sharded allocator handles far better than the system default.
mimalloc = { version = "0.1", optional = true }
# Alternative allocator: jemalloc (tikv fork) — battle-tested in long-running
# latency-sensitive servers, strong fragmentation control / steady-state RSS.
tikv-jemallocator = { version = "0.6", optional = true }

[features]
# Install a fast global allocator. All off by default (system allocator); pick
# one after benching. Mutually exclusive — enable at most one.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
# Enables the additive trust-root hook only for examples/tests/benches — NOT the
# shipped binary (dev-dependencies are absent from a normal `cargo build`).
bulwark-upstream = { workspace = true, features = ["test-trust-roots"] }
# Self-signed cert generation for the mock upstreams in `bench_transports`.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# TLS / QUIC server sides of the mock upstreams.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
quinn.workspace = true
# DoH (h1/h2) mock server.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http = "1"
# DoH (HTTP/3) mock server.
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes.workspace = true
