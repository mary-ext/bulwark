[package]
name = "bulwark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "bulwark"

[[bin]]
name = "bulwark"
path = "src/main.rs"

[dependencies]
bulwark-filter.workspace = true
bulwark-upstream.workspace = true
bulwark-config.workspace = true
bulwark-engine.workspace = true
hickory-proto.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
utoipa.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
time.workspace = true
argon2.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
humantime.workspace = true
turso.workspace = true
mime_guess = "2"
# Server allocator.
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"

[dev-dependencies]
# Local TLS roots for benchmarks and tests.
bulwark-upstream = { workspace = true, features = ["test-trust-roots"] }
# Mock certificates.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Mock TLS and QUIC servers.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
quinn.workspace = true
# Mock DoH servers.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes.workspace = true
