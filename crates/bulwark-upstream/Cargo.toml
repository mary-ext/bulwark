[package]
name = "bulwark-upstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Allows registering additional TLS trust anchors at runtime via
# `add_trust_root`. Used only by benchmarks/tests to point the real encrypted
# transports at a local mock with a self-signed cert; never enabled for the
# shipped binary (the server crate pulls it in as a dev-dependency only).
test-trust-roots = []

[dependencies]
hickory-proto.workspace = true
tokio.workspace = true
futures.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
quinn.workspace = true
reqwest.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
