[package]
name = "bulwark-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bulwark-filter.workspace = true
bulwark-upstream.workspace = true
bulwark-config.workspace = true
hickory-proto.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
ahash.workspace = true
ipnet.workspace = true
time.workspace = true
lru.workspace = true
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# statsprobe only: match the server's global allocator so the measured retained
# heap reflects production (glibc malloc retains freed memory very differently).
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
