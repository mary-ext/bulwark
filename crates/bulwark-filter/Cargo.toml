[package]
name = "bulwark-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
regex.workspace = true
ahash.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
ipnet.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Match the server's global allocator so memprobe's RSS reflects production
# (the server runs under jemalloc; glibc malloc retains freed build memory
# very differently, which would make the per-rule figure misleading).
tikv-jemallocator = "0.6"
# fstprobe experiment only: evaluate an FST domain index vs the hashmap.
fst = "0.4"
# memprobe only: verify the runtime background_thread ctl the server uses.
tikv-jemalloc-ctl = "0.6"
