[workspace]
resolver = "2"
members = [
    "crates/bulwark-filter",
    "crates/bulwark-upstream",
    "crates/bulwark-config",
    "crates/bulwark-engine",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Bulwark contributors"]
repository = "https://github.com/mary-ext/bulwark"

[workspace.dependencies]
# Internal crates
bulwark-filter = { path = "crates/bulwark-filter" }
bulwark-upstream = { path = "crates/bulwark-upstream" }
bulwark-config = { path = "crates/bulwark-config" }
bulwark-engine = { path = "crates/bulwark-engine" }

# DNS protocol types and codec.
hickory-proto = { version = "0.26", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "cors"] }
rust-embed = { version = "8", features = ["mime-guess"] }
utoipa = { version = "5", features = ["axum_extras"] }

# TLS / QUIC / HTTP for upstream transports
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "http3"] }

# Serialization / config
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
arc-swap = "1"
dashmap = "6"
regex = "1"
once_cell = "1"
lru = "0.12"
bytes = "1"
ahash = "0.8"
rand = "0.9"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
humantime = "2"
ipnet = { version = "2", features = ["serde"] }
argon2 = "0.5"
base64 = "0.22"
# Stateless session signing.
hmac = "0.12"
sha2 = "0.10"
# SQLite-compatible storage without its bundled allocator or FTS.
turso = { version = "0.7.0-pre.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
