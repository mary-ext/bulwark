services:
  bulwark:
    build: .
    image: bulwark:latest
    container_name: bulwark
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
    volumes:
      - bulwark-data:/data
    # environment:
    #   BULWARK_LOG: bulwark=debug   # raise log verbosity

volumes:
  bulwark-data:

networks:
  # Dual-stack so upstreams can be reached over IPv6 (avoids the per-connection
  # happy-eyeballs fallback to IPv4). Docker 27+ auto-assigns a ULA prefix and
  # sets up IPv6 NAT, so egress works without extra host plumbing. If v6 egress
  # is unavailable the DoH client still falls back to IPv4.
  default:
    enable_ipv6: true
