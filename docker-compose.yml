services:
  bulwark:
    build: .
    image: bulwark:latest
    container_name: bulwark
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
    volumes:
      - bulwark-data:/data
    # environment:
    #   BULWARK_LOG: bulwark=debug   # raise log verbosity

volumes:
  bulwark-data:

networks:
  # Enable IPv6 upstream access.
  default:
    enable_ipv6: true
